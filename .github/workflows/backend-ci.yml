name: backend-ci
on:
  push:
    branches: [backend]
  pull_request:
    branches: [petal, backend]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # RLS cross-tenant isolation + repository/auth suite (in-process PGlite, no services).
      - run: npm run test
