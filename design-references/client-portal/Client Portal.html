<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1400"/>
<title>Petal v4 — Client Portal Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;700&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #F5F2EA; font-family: "DM Sans", -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  /* scrollbars inside phone frames */
  .phone-scroll::-webkit-scrollbar { width: 0; background: transparent; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components/ios-frame.jsx"></script>
<script type="text/babel" src="components/tokens.jsx"></script>
<script type="text/babel" src="components/intake-screens.jsx"></script>
<script type="text/babel" src="components/tutorial.jsx"></script>
<script type="text/babel" src="components/docs-upload.jsx"></script>
<script type="text/babel" src="components/personal-info.jsx"></script>
<script type="text/babel" src="components/spouse-info.jsx"></script>
<script type="text/babel" src="components/dependents-count.jsx"></script>
<script type="text/babel" src="components/dependent-details.jsx"></script>
<script type="text/babel" src="components/self-employment.jsx"></script>
<script type="text/babel" src="components/tax-questions.jsx"></script>
<script type="text/babel" src="components/deductions.jsx"></script>
<script type="text/babel" src="components/refund-preference.jsx"></script>
<script type="text/babel" src="components/life-events.jsx"></script>
<script type="text/babel" src="components/schedule-appt.jsx"></script>
<script type="text/babel" src="components/deposit.jsx"></script>
<script type="text/babel" src="components/business-info.jsx"></script>
<script type="text/babel" src="components/business-formation.jsx"></script>
<script type="text/babel" src="components/strategic-contact.jsx"></script>
<script type="text/babel" src="components/rental-state.jsx"></script>
<script type="text/babel" src="components/profile-screen.jsx"></script>
<script type="text/babel" src="components/portal-screens.jsx"></script>
<script type="text/babel" src="components/payment-and-sign.jsx"></script>
<script type="text/babel" src="components/app-shell.jsx"></script>

<script type="text/babel">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "tone": "minimal",
  "fonts": "classic",
  "density": "comfortable",
  "accentHue": 150,
  "deviceFrame": "bezel"
}/*EDITMODE-END*/;

function App() {
  const [tab, setTab] = React.useState(() => {
    try { return localStorage.getItem('petal:tab') || 'canvas'; } catch { return 'canvas'; }
  });
  const [tweaksOn, setTweaksOn] = React.useState(false);
  const [tweaks, setTweaks] = React.useState(TWEAKS);

  React.useEffect(() => {
    try { localStorage.setItem('petal:tab', tab); } catch {}
  }, [tab]);

  // Tweaks protocol
  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || !e.data.type) return;
      if (e.data.type === '__activate_edit_mode') setTweaksOn(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOn(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setKey = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const t = useTheme(tweaks);

  return (
    <div style={{ background: t.bg, minHeight: '100vh', color: t.ink, fontFamily: t.sans }}>
      {/* Top bar — tabs */}
      <div style={{
        position: 'sticky', top: 0, zIndex: 50,
        background: `${t.bg}F2`,
        backdropFilter: 'blur(16px)',
        WebkitBackdropFilter: 'blur(16px)',
        borderBottom: `1px solid ${t.border}`,
        padding: '14px 28px',
        display: 'flex', alignItems: 'center', gap: 20,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{
            width: 28, height: 28, borderRadius: '50%',
            background: `radial-gradient(circle at 30% 30%, ${t.rustSoft}, ${t.bgElev})`,
            border: `1px solid ${t.border}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: t.serif, fontSize: 14, color: t.rustInk,
          }}>D</div>
          <span style={{ fontFamily: t.serif, fontSize: 16, color: t.ink, letterSpacing: -0.2 }}>
            Petal v4 · Client Portal
          </span>
        </div>

        <div style={{ flex: 1 }}/>

        {/* Tabs */}
        <div style={{
          display: 'flex', gap: 4,
          background: t.bgElev,
          border: `1px solid ${t.border}`,
          borderRadius: 999, padding: 3,
        }}>
          {['canvas', 'prototype'].map(k => {
            const on = tab === k;
            return (
              <button key={k} onClick={() => setTab(k)} style={{
                padding: '7px 16px',
                border: 'none',
                borderRadius: 999,
                background: on ? t.ink : 'transparent',
                color: on ? t.bgElev : t.inkSoft,
                fontSize: 13,
                fontWeight: 500,
                cursor: 'pointer',
                letterSpacing: -0.1,
                transition: 'all 0.15s',
                textTransform: 'capitalize',
              }}>{k === 'canvas' ? 'Canvas' : 'Prototype'}</button>
            );
          })}
        </div>

        <div style={{
          fontFamily: t.mono, fontSize: 11, color: t.muted, letterSpacing: 0.5,
          paddingLeft: 16, borderLeft: `1px solid ${t.border}`,
        }}>
          {tweaks.tone.toUpperCase()} · {FONT_PAIRINGS[tweaks.fonts].label}
        </div>
      </div>

      {/* Content */}
      {tab === 'canvas' && <CanvasOverview t={t} deviceFrame={tweaks.deviceFrame} />}
      {tab === 'prototype' && <Prototype t={t} deviceFrame={tweaks.deviceFrame} />}

      {/* Tweaks panel */}
      {tweaksOn && (
        <div style={{
          position: 'fixed',
          right: 20, bottom: 20,
          width: 300,
          background: t.card,
          border: `1px solid ${t.border}`,
          borderRadius: 14,
          boxShadow: '0 20px 60px rgba(0,0,0,0.15)',
          padding: 20,
          zIndex: 100,
          fontFamily: t.sans,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 18 }}>
            <div style={{ fontFamily: t.serif, fontSize: 18, color: t.ink, letterSpacing: -0.2 }}>Tweaks</div>
            <div style={{ fontFamily: t.mono, fontSize: 10, color: t.muted, letterSpacing: 0.5 }}>LIVE</div>
          </div>

          <Stack gap={18}>
            <TweakGroup t={t} label="Tone"
              options={[['editorial','Warm editorial'],['minimal','Minimal'],['magazine','Magazine']]}
              value={tweaks.tone} onChange={v => setKey('tone', v)} />

            <TweakGroup t={t} label="Font pairing"
              options={[['classic','Fraunces / DM Sans'],['instrument','Instrument / Geist'],['newsreader','Newsreader / Manrope']]}
              value={tweaks.fonts} onChange={v => setKey('fonts', v)} />

            <TweakGroup t={t} label="Density"
              options={[['comfortable','Comfortable'],['cozy','Cozy']]}
              value={tweaks.density} onChange={v => setKey('density', v)} />

            <TweakGroup t={t} label="Device frame"
              options={[['clean','Clean'],['bezel','iPhone bezel']]}
              value={tweaks.deviceFrame} onChange={v => setKey('deviceFrame', v)} />

            <div>
              <div style={{ fontFamily: t.mono, fontSize: 10, color: t.muted, letterSpacing: 1, marginBottom: 8 }}>
                ACCENT HUE · <span style={{ color: t.rust }}>●</span> {tweaks.accentHue}°
              </div>
              <input type="range" min="130" max="170" step="1"
                value={tweaks.accentHue}
                onChange={e => setKey('accentHue', parseInt(e.target.value))}
                style={{ width: '100%', accentColor: t.rust }}/>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: t.mono, fontSize: 9, color: t.muted, marginTop: 4 }}>
                <span>fir</span><span>forest</span><span>moss</span>
              </div>
            </div>
          </Stack>
        </div>
      )}
    </div>
  );
}

function TweakGroup({ t, label, options, value, onChange }) {
  return (
    <div>
      <div style={{ fontFamily: t.mono, fontSize: 10, color: t.muted, letterSpacing: 1, marginBottom: 8 }}>
        {label.toUpperCase()}
      </div>
      <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
        {options.map(([v, l]) => {
          const on = value === v;
          return (
            <button key={v} onClick={() => onChange(v)} style={{
              padding: '6px 12px',
              fontSize: 12,
              border: `1px solid ${on ? t.rust : t.border}`,
              background: on ? t.tintAccent : 'transparent',
              color: on ? t.rustInk : t.inkSoft,
              borderRadius: 999,
              cursor: 'pointer',
              fontFamily: t.sans,
              fontWeight: on ? 500 : 400,
            }}>{l}</button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
